name: Daily Delta Force Codes Posting

on:
  schedule:
    # Runs at 08:05 UTC every day (right after code reset)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py
